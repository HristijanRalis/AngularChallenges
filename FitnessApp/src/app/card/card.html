<div class="mb-4 p-8 flex items-center justify-center">
  <p-card [style]="{ overflow: 'hidden' }">
    <ng-template #header>
      <img alt="Card" class="w-full" [src]="imageSrc" />
    </ng-template>
    <h3 class="font-bold text-lg capitalize">{{ title }}</h3>
    <h4 class="text-gray-500 text-m capitalize">{{ subTitle }}</h4>
    <p>
      {{ description }}
    </p>
  </p-card>
</div>
